<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Tổng quan nhân sự</title>
    <link rel="stylesheet" href="./../build/css/style.min.css" />
  </head>
  <body>
    <div id="main">
      <main class="oh-auth">
          <div class="oh-auth-card">
            <h1 class="oh-onboarding-card__title oh-onboarding-card__title--h2 text-center my-3">Đăng nhập</h1>
            <p class="text-muted text-center">Vui lòng đăng nhập để truy cập hệ thống.</p>
            <div class="oh-form-group">
              <div class="oh-input-group">
                <label class="oh-label" for="email">Email</label>
                <input type="email" id="email" class="oh-input w-100" placeholder="Ví dụ: nguyenvanan@example.com" />
              </div>
              <div class="oh-input-group">
                <label class="oh-label" for="password">Mật khẩu</label>
                <div class="oh-password-input-container">
                  <input
                    type="password"
                    id="password"
                    class="oh-input oh-input--password w-100"
                    placeholder="Dùng chữ và số"
                  />
                  <button
                    class="oh-btn oh-btn--transparent oh-password-input--toggle"
                  >
                    <ion-icon
                      class="oh-passowrd-input__show-icon"
                      title="Hiển thị mật khẩu"
                      name="eye-outline"
                    ></ion-icon>
                    <ion-icon
                      class="oh-passowrd-input__hide-icon d-none"
                      title="Ẩn mật khẩu"
                      name="eye-off-outline"
                    ></ion-icon>
                  </button>
                </div>
              </div>
              <button
              href="#"
              class="oh-btn oh-onboarding-card__button mt-4 oh-btn--secondary oh-btn--shadow w-100 mb-4"
              role="button"
            >
            <ion-icon class="me-2" name="lock-closed-outline"></ion-icon>
              Đăng nhập an toàn
            </button>
            <small class="text-center"><a href="#" class="oh-link oh-link--secondary justify-content-center">Quên mật khẩu?</a></small>
            </div>
          </div>
      </main>
    </div>
    <script src="./../build/js/web.frontend.min.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
    <script></script>
  </body>
</html>
